<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>DevPulse Invitation</title>
</head>

<body style="font-family:Arial,sans-serif;background:#f5f5f5;padding:30px;">

    <div style="max-width:650px;background:#ffffff;margin:auto;padding:30px;border-radius:10px;">

        <h2 style="color:#2563eb;"> Welcome to DevPulse 🚀 </h2>

        <p>Hello <b>{{NAME}}</b>,</p>

        <p> You have been invited to join <b>DevPulse</b> as
            <b>{{ROLE}}</b>.
        </p>

        <p> Click the button below to activate your account. </p>

        <p style="text-align:center;margin:40px 0;">

            <a href="{{INVITE_LINK}}" style="
                    background:#2563eb;
                    color:white;
                    padding:15px 30px;
                    text-decoration:none;
                    border-radius:8px;
                ">
                Accept Invitation
            </a>
        </p>

        <p> This invitation expires in <b>48 hours</b>. </p>
        <hr>
        <small>
            If you weren't expecting this invitation, please ignore this email.
        </small>
    </div>

</body>

</html>
