<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-brand-500 flex items-center justify-center font-bold text-white text-xl mx-auto mb-3">D</div>
      <h1 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Sign in to DevPulse</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Track work. Measure growth. Improve productivity.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 space-y-4">
      @if (errorMessage()) {
        <div class="text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 rounded-lg px-3 py-2">{{ errorMessage() }}</div>
      }

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
          placeholder="you@company.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
          placeholder="••••••••"
        />
      </div>

      <div class="flex justify-end">
        <a routerLink="/forgot-password" class="text-xs text-brand-600 dark:text-brand-400 hover:underline">Forgot password?</a>
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white text-sm font-medium py-2.5 rounded-lg transition-colors"
      >
        {{ loading() ? "Signing in..." : "Sign in" }}
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
      New to DevPulse?
      <a routerLink="/signup" class="text-brand-600 dark:text-brand-400 font-medium hover:underline">Create your company</a>
    </p>
  </div>
</div>
