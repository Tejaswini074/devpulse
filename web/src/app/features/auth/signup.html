<app-auth-shell>
  <div class="text-center mb-8">
    <h1 class="text-2xl font-semibold text-slate-900 dark:text-slate-100 tracking-tight">Create your company</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1.5">Set up your organization and admin account</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 rounded-2xl shadow-lg shadow-slate-200/60 dark:shadow-none p-7 space-y-4">
    @if (errorMessage()) {
      <div class="text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 rounded-lg px-3 py-2">{{ errorMessage() }}</div>
    }

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Organization name</label>
      <input
        type="text"
        formControlName="organization_name"
        class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3.5 py-2.5 text-sm transition-shadow focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500"
        placeholder="Acme Inc."
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Your name</label>
      <input
        type="text"
        formControlName="name"
        class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3.5 py-2.5 text-sm transition-shadow focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500"
        placeholder="Jane Doe"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
      <input
        type="email"
        formControlName="email"
        class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3.5 py-2.5 text-sm transition-shadow focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500"
        placeholder="you@company.com"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
      <input
        type="password"
        formControlName="password"
        class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3.5 py-2.5 text-sm transition-shadow focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500"
        placeholder="At least 8 characters"
      />
    </div>

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full bg-brand-600 hover:bg-brand-700 active:bg-brand-800 disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-medium py-2.5 rounded-lg shadow-sm shadow-brand-600/30 transition-all hover:shadow-md hover:shadow-brand-600/40"
    >
      {{ loading() ? "Creating..." : "Create company" }}
    </button>
  </form>

  <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-7">
    Already have an account?
    <a routerLink="/login" class="text-brand-600 dark:text-brand-400 font-medium hover:text-brand-700 dark:hover:text-brand-300 hover:underline transition-colors">Sign in</a>
  </p>
</app-auth-shell>
