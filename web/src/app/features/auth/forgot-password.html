<app-auth-shell>
  <div class="text-center mb-8">
    <h1 class="text-2xl font-semibold text-slate-900 dark:text-slate-100 tracking-tight">Forgot your password?</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1.5">We'll email you a link to reset it</p>
  </div>

  <div class="bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 rounded-2xl shadow-lg shadow-slate-200/60 dark:shadow-none p-7">
    @if (submitted()) {
      <div class="text-sm text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-500/10 border border-green-100 dark:border-green-500/20 rounded-lg px-3 py-2 text-center">
        If an account exists for that email, a reset link has been sent.
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        @if (errorMessage()) {
          <div class="text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 rounded-lg px-3 py-2">{{ errorMessage() }}</div>
        }

        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
          <input
            type="email"
            formControlName="email"
            class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3.5 py-2.5 text-sm transition-shadow focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500"
            placeholder="you@company.com"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-brand-600 hover:bg-brand-700 active:bg-brand-800 disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-medium py-2.5 rounded-lg shadow-sm shadow-brand-600/30 transition-all hover:shadow-md hover:shadow-brand-600/40"
        >
          {{ loading() ? "Sending..." : "Send reset link" }}
        </button>
      </form>
    }
  </div>

  <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-7">
    <a routerLink="/login" class="text-brand-600 dark:text-brand-400 font-medium hover:text-brand-700 dark:hover:text-brand-300 hover:underline transition-colors">Back to sign in</a>
  </p>
</app-auth-shell>
