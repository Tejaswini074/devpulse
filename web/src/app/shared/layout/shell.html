<div class="min-h-screen flex bg-slate-50 dark:bg-slate-950">
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-black/40 md:hidden" (click)="closeSidebar()"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 w-64 shrink-0 bg-slate-900 text-slate-200 flex flex-col transition-transform duration-200 md:static md:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="px-5 py-5 flex items-center justify-between gap-2 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center font-bold text-white">D</div>
        <div>
          <div class="font-semibold text-white leading-tight">DevPulse</div>
          <div class="text-[11px] text-slate-400 leading-tight">Productivity Tracker</div>
        </div>
      </div>
      <button (click)="closeSidebar()" class="md:hidden text-slate-400 hover:text-white p-1">
        <app-icon name="x" [size]="20" />
      </button>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      @for (item of visibleNavItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-600 text-white"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
        >
          <app-icon [name]="item.icon" [size]="18" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="px-3 py-4 border-t border-slate-800">
      <div class="flex items-center gap-3 px-2 mb-3">
        <div class="w-9 h-9 rounded-full bg-brand-500 flex items-center justify-center text-sm font-semibold text-white">
          {{ auth.currentUser()?.name?.charAt(0) }}
        </div>
        <div class="min-w-0">
          <div class="text-sm font-medium text-white truncate">{{ auth.currentUser()?.name }}</div>
          <div class="text-xs text-slate-400 truncate">{{ auth.currentUser()?.role }}</div>
        </div>
      </div>
      <button
        (click)="logout()"
        class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
      >
        <app-icon name="log-out" [size]="16" />
        Sign out
      </button>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <header class="flex items-center gap-3 px-4 py-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20">
      <button (click)="toggleSidebar()" class="md:hidden text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white p-1">
        <app-icon name="menu" [size]="22" />
      </button>
      <div class="md:hidden flex items-center gap-2">
        <div class="w-6 h-6 rounded-md bg-brand-500 flex items-center justify-center font-bold text-white text-xs">D</div>
        <span class="font-semibold text-slate-900 dark:text-white">DevPulse</span>
      </div>
      <button
        (click)="toggleTheme()"
        class="ml-auto text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>
    </header>

    <main class="flex-1 min-w-0 overflow-y-auto">
      <div class="max-w-6xl mx-auto p-4 sm:p-6 md:p-8">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
