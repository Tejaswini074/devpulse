<div class="min-h-screen flex bg-slate-50">
  <aside class="w-64 shrink-0 bg-slate-900 text-slate-200 flex flex-col">
    <div class="px-5 py-5 flex items-center gap-2 border-b border-slate-800">
      <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center font-bold text-white">D</div>
      <div>
        <div class="font-semibold text-white leading-tight">DevPulse</div>
        <div class="text-[11px] text-slate-400 leading-tight">Productivity Tracker</div>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
      @for (item of visibleNavItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-600 text-white"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
        >
          <app-icon [name]="item.icon" [size]="18" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="px-3 py-4 border-t border-slate-800">
      <div class="flex items-center gap-3 px-2 mb-3">
        <div class="w-9 h-9 rounded-full bg-brand-500 flex items-center justify-center text-sm font-semibold text-white">
          {{ auth.currentUser()?.name?.charAt(0) }}
        </div>
        <div class="min-w-0">
          <div class="text-sm font-medium text-white truncate">{{ auth.currentUser()?.name }}</div>
          <div class="text-xs text-slate-400 truncate">{{ auth.currentUser()?.role }}</div>
        </div>
      </div>
      <button
        (click)="logout()"
        class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors"
      >
        <app-icon name="log-out" [size]="16" />
        Sign out
      </button>
    </div>
  </aside>

  <main class="flex-1 min-w-0 overflow-y-auto">
    <div class="max-w-6xl mx-auto p-6 md:p-8">
      <router-outlet />
    </div>
  </main>
</div>
